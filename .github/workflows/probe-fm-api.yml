name: probe-fm-api

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Dump FoundationModels signatures
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IF="$SDK/System/Library/Frameworks/FoundationModels.framework/Modules/FoundationModels.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "=========== lines 30-80 ==========="
          sed -n '30,80p' "$IF" || true
          echo "=========== quota usage ==========="
          grep -n 'QuotaUsage' "$IF" | head -20 || true
          echo "=========== session decl ==========="
          grep -nE 'LanguageModelSession' "$IF" | head -20 || true
          echo "=========== instructions-init context ==========="
          grep -n -B8 'instructions: FoundationModels::Instructions? = nil' "$IF" | head -90 || true
          echo "=========== done ==========="
          true
