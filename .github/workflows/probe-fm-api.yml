name: probe-fm-api

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Dump PCC init and generic session init
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IF="$SDK/System/Library/Frameworks/FoundationModels.framework/Modules/FoundationModels.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "=========== 44-64 ==========="
          sed -n '44,64p' "$IF" || true
          echo "=========== 1940-1960 ==========="
          sed -n '1940,1960p' "$IF" || true
          echo "=========== entitlement / info keys ==========="
          grep -niE 'entitlement|Info\.plist|NSApple' "$IF" | head -20 || true
          echo "=========== pcc authenticate / session helpers ==========="
          grep -nE 'public convenience init|public init()' "$IF" | head -30 || true
          echo "=========== done ==========="
          true
