name: probe-fm-api

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Dump FoundationModels interface symbols
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IF="$SDK/System/Library/Frameworks/FoundationModels.framework/Modules/FoundationModels.swiftmodule/arm64e-apple-ios.swiftinterface"
          ls -la "$(dirname "$IF")"
          echo "LINES=$(wc -l < "$IF")"
          echo "=========== availability / model ==========="
          grep -nE 'SystemLanguageModel|Availability|UnavailableReason|deviceNotEligible|appleIntelligence' "$IF" | head -60
          echo "=========== session ==========="
          grep -nE 'LanguageModelSession|func respond|struct Response|public init' "$IF" | head -60
          echo "=========== private cloud ==========="
          grep -niE 'privatecloud|private cloud|pcc|server|quota|entitlement' "$IF" | head -40
          echo "=========== all top-level types ==========="
          grep -nE '^public (struct|class|enum|protocol|actor|extension)' "$IF" | head -80
