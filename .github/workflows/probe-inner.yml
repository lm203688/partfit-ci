name: probe-inner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build for simulator (Release)
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20

      - name: Probe surfaces (best effort, never fails the job)
        continue-on-error: true
        run: |
          set -x
          mkdir -p out
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"

          # ---------- Duo ----------
          UDID=$(xcrun simctl create "DuoCI" "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" "com.apple.CoreSimulator.SimRuntime.iOS-27-1" || true)
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          sleep 20

          xcrun simctl io "$UDID" enumerate > out/io-enumerate.txt 2>&1 || true
          xcrun simctl help > out/simctl-help.txt 2>&1 || true
          xcrun simctl io help > out/io-help.txt 2>&1 || true
          xcrun simctl list devicetypes > out/devicetypes.txt 2>&1 || true

          # every display, several attempts
          for d in 1 2 3 5; do
            for i in 1 2; do
              xcrun simctl io "$UDID" screenshot --display=$d "out/duo-d$d-try$i.png" && break || sleep 3
            done
          done
          xcrun simctl io "$UDID" screenshot --mask=ignored "out/duo-mask-ignored.png" || true

          # GUI host: DeviceHub lives inside Xcode.app
          ls -d /Applications/Xcode_27.1.app/Contents/Applications/* 2>/dev/null || true
          HUB=/Applications/Xcode_27.1.app/Contents/Applications/DeviceHub.app/Contents/MacOS/DeviceHub
          if [ -x "$HUB" ]; then
            "$HUB" --args -CurrentDeviceUDID "$UDID" > "$RUNNER_TEMP/hub.log" 2>&1 &
            sleep 25
            head -40 "$RUNNER_TEMP/hub.log" || true
          fi

          # what windows exist, and can we grab one
          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          let opts: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          if let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] {
            for w in list {
              let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
              let name = w[kCGWindowName as String] as? String ?? ""
              let num = w[kCGWindowNumber as String] as? Int ?? -1
              let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
              print("\(num)\t\(owner)\t\(name)\t\(b)")
            }
          }
          SWIFT
          swift "$RUNNER_TEMP/windows.swift" > out/windows.txt 2>&1 || true

          for w in $(awk -F'\t' '/DeviceHub|Simulator|CoreSimulator/ {print $1}' out/windows.txt); do
            screencapture -x -o -l "$w" "out/window-$w.png" || true
          done
          screencapture -x -o "out/screen-full.png" || true

          # after GUI host came up, retry the inner display
          xcrun simctl io "$UDID" screenshot --display=3 "out/duo-d3-after-hub.png" || true

          ls -l out || true
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f" || true; done

      - name: Probe iPad wide layout
        continue-on-error: true
        run: |
          set -x
          mkdir -p outpad
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          TYPE=$(grep -o 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch[a-zA-Z0-9-]*' out/devicetypes.txt | head -1)
          echo "TYPE=$TYPE"
          [ -n "$TYPE" ] || TYPE=com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4
          PAD=$(xcrun simctl create "PadCI" "$TYPE" "com.apple.CoreSimulator.SimRuntime.iOS-27-1" || true)
          echo "PAD=$PAD"
          xcrun simctl boot "$PAD" || true
          xcrun simctl bootstatus "$PAD" -b || true
          xcrun simctl install "$PAD" "$APP" || true
          xcrun simctl launch "$PAD" "$BUNDLE_ID" || true
          sleep 25
          xcrun simctl io "$PAD" screenshot "outpad/pad-portrait.png" || true
          sips -g pixelWidth -g pixelHeight outpad/*.png || true
          ls -l outpad || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-inner
          path: |
            out
            outpad
          if-no-files-found: warn
