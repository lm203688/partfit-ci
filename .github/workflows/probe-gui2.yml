name: probe-gui2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Duo + system app + every GUI host path
        continue-on-error: true
        run: |
          set -x
          mkdir -p out
          UDID=$(xcrun simctl create "DuoGUI" "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" "com.apple.CoreSimulator.SimRuntime.iOS-27-1" || true)
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

          ls /Applications/Xcode_27.1.app/Contents/Developer/Applications/ > out/devapps.txt 2>&1 || true
          cat out/devapps.txt || true

          # try the real Simulator.app from the Developer dir
          SIM=/Applications/Xcode_27.1.app/Contents/Developer/Applications/Simulator.app
          if [ -d "$SIM" ]; then
            open "$SIM" --args -CurrentDeviceUDID "$UDID" || true
            sleep 40
          fi

          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          let opts: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          if let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] {
            for w in list {
              let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
              let name = w[kCGWindowName as String] as? String ?? ""
              let num = w[kCGWindowNumber as String] as? Int ?? -1
              let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
              print("\(num)\t\(owner)\t\(name)\t\(b)")
            }
          }
          SWIFT
          swift "$RUNNER_TEMP/windows.swift" > out/windows.txt 2>&1 || true
          cat out/windows.txt || true

          # system app on screen, then every display
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          sleep 12
          xcrun simctl io "$UDID" enumerate > out/enumerate.txt 2>&1 || true
          for d in 1 3 5; do
            xcrun simctl io "$UDID" screenshot --display=$d "out/pref-d$d.png" || true
          done

          # scene display: resizable, try to host content at both geometries
          xcrun simctl io "$UDID" screenConfig --display=5 geometry 2007x2853@3 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=5 "out/scene-2007-pref.png" || true
          xcrun simctl io "$UDID" screenConfig --display=5 geometry 669x951@3 || true
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=5 "out/scene-669-pref.png" || true

          # whole desktop, and per-window grabs
          screencapture -x -o "out/desktop.png" || true
          for w in $(awk -F'\t' '/Simulator|DeviceHub|CoreSimulator/ {print $1}' out/windows.txt); do
            screencapture -x -o -l "$w" "out/win-$w.png" || true
          done

          ls -l out || true
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f" || true; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-gui2
          path: out
          if-no-files-found: warn
