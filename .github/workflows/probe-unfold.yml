name: probe-unfold

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: unfold
        run: |
          set +e
          UDID=$(xcrun simctl create "DuoUF" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          open -a "/Applications/Xcode_27.1.app/Contents/Applications/DeviceHub.app"
          sleep 25
          mkdir -p out
          echo "=== processes ==="
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1
          echo "=== menubar ==="
          osascript -e 'tell application "System Events" to tell process "Device Hub" to get name of every menu bar item of menu bar 1' 2>&1
          echo "=== Device menu ==="
          osascript -e 'tell application "System Events" to tell process "Device Hub" to get name of every menu item of menu 1 of menu bar item "Device" of menu bar 1' 2>&1
          echo "=== Controls menu ==="
          osascript -e 'tell application "System Events" to tell process "Device Hub" to get name of every menu item of menu 1 of menu bar item "Controls" of menu bar 1' 2>&1
          echo "=== View menu ==="
          osascript -e 'tell application "System Events" to tell process "Device Hub" to get name of every menu item of menu 1 of menu bar item "View" of menu bar 1' 2>&1
          echo "=== window size ==="
          osascript -e 'tell application "System Events" to tell process "Device Hub" to get {name, size, position} of every window' 2>&1
          echo "=== after state shots ==="
          for d in 1 3; do xcrun simctl io "$UDID" screenshot --display=$d "out/pre$d.png" 2>&1; done
          screencapture -x out/pre-host.png
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-unfold-shots
          path: out
          if-no-files-found: warn
