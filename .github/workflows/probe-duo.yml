name: probe-duo
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: duotype plist
        run: |
          set -x
          DT=~/Library/Developer/CoreSimulator/Profiles/DeviceTypes
          ls "$DT" | grep -i duo || true
          P=$(ls -d "$DT"/*Duo*.simdevicetype 2>/dev/null | head -1)
          echo "P=$P"
          if [ -n "$P" ]; then
            plutil -p "$P/Contents/Resources/profile.plist" | head -60
          fi
      - name: screens
        run: |
          set -x
          DT=~/Library/Developer/CoreSimulator/Profiles/DeviceTypes
          P=$(ls -d "$DT"/*Duo*.simdevicetype 2>/dev/null | head -1)
          plutil -p "$P/Contents/Resources/profile.plist" 2>/dev/null | grep -i -A4 -E "Screen|Pixel|Size|Scale|Fold" | head -80 || true
