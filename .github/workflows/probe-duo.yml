name: probe-duo
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: boot duo sim and screenshot
        run: |
          set -x
          xcrun simctl list devices available | head -20
          UDID=$(xcrun simctl create "DuoProbe" "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" "com.apple.CoreSimulator.SimRuntime.iOS-27-1")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          sleep 5
          xcrun simctl io "$UDID" screenshot /tmp/duo-open.png || true
          python3 -c "from PIL import Image; im=Image.open('/tmp/duo-open.png'); print('OPEN', im.size)" || file /tmp/duo-open.png
          mkdir -p out
          cp /tmp/duo-open.png out/duo-open.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: duo-shots
          path: out
