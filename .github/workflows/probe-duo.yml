name: probe-duo
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: find all simdevicetypes
        run: |
          set -x
          find /Applications -name "*Duo*.simdevicetype" 2>/dev/null | head -5
          find /Applications -name "*.simdevicetype" 2>/dev/null | grep -i -E "Duo|18-Pro" | head -10
          ls "/Applications/Xcode_27.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/DeviceTypes" 2>/dev/null | head -30
      - name: dump
        run: |
          P=$(find /Applications -name "*Duo*.simdevicetype" 2>/dev/null | head -1)
          echo "P=$P"
          plutil -p "$P/Contents/Resources/profile.plist" 2>/dev/null | head -100
