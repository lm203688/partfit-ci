name: probe-duo
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          sw_vers
      - name: runtimes
        run: xcrun simctl list runtimes || true
      - name: devicetypes
        run: |
          echo "-----ALL DEVICE TYPES-----"
          xcrun simctl list devicetypes || true
      - name: duo match
        run: |
          echo "-----DUO/FOLD/18 MATCH-----"
          xcrun simctl list devicetypes | grep -i -E "duo|fold|iphone 18" || echo "NO MATCH"
      - name: sdk headers hint
        run: |
          SDKR=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=$SDKR"
          grep -rl -i "hingeAngle\|foldState\|Foldable" "$SDKR/System/Library/Frameworks/UIKit.framework/Headers" 2>/dev/null | head -20 || echo "no uikit match"
          ls "$SDKR/System/Library/Frameworks" | grep -i -E "hinge|fold|duo" || echo "no framework match"
