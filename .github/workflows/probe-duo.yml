name: probe-duo
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: locate duotype
        run: |
          set -x
          P=$(find /Applications/Xcode_27.1.app -name "iPhone-Duo.simdevicetype" -maxdepth 8 2>/dev/null | head -1)
          echo "P=$P"
          ls "$P/Contents/Resources" 2>/dev/null
          plutil -p "$P/Contents/Resources/profile.plist" 2>/dev/null | head -80
      - name: metrics
        run: |
          P=$(find /Applications/Xcode_27.1.app -name "iPhone-Duo.simdevicetype" -maxdepth 8 2>/dev/null | head -1)
          plutil -p "$P/Contents/Resources/profile.plist" 2>/dev/null | grep -i -E "Screen|Pixel|Width|Height|Scale|Fold|Inch|Point" | head -60
          echo "--- iphone18pro ---"
          P2=$(find /Applications/Xcode_27.1.app -name "iPhone-18-Pro.simdevicetype" -maxdepth 8 2>/dev/null | head -1)
          plutil -p "$P2/Contents/Resources/profile.plist" 2>/dev/null | grep -i -E "Screen|Pixel|Width|Height|Scale" | head -40
