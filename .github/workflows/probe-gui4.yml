name: probe-gui4

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Boot Duo and open Device Hub
        continue-on-error: true
        run: |
          set -x
          mkdir -p out
          UDID=$(xcrun simctl create "DuoGUI" "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" "com.apple.CoreSimulator.SimRuntime.iOS-27-1" || true)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          open /Applications/Xcode_27.1.app/Contents/Applications/DeviceHub.app --args -CurrentDeviceUDID "$UDID" || true
          sleep 45

          cat > "$RUNNER_TEMP/winbounds.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          let opts: CGWindowListOption = [.optionAll, .excludeDesktopElements]
          if let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] {
            for w in list {
              let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
              let name = w[kCGWindowName as String] as? String ?? ""
              let num = w[kCGWindowNumber as String] as? Int ?? -1
              let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
              let x = b["X"] as? Double ?? -1
              let y = b["Y"] as? Double ?? -1
              let wd = b["Width"] as? Double ?? -1
              let ht = b["Height"] as? Double ?? -1
              print("\(num)\t\(owner)\t\(name)\t\(Int(x))\t\(Int(y))\t\(Int(wd))\t\(Int(ht))")
            }
          }
          SWIFT
          swift "$RUNNER_TEMP/winbounds.swift" > out/win-before.txt 2>&1 || true
          cat out/win-before.txt || true

      - name: Click the form-factor buttons
        continue-on-error: true
        run: |
          set -x
          cat > "$RUNNER_TEMP/click.swift" <<'SWIFT'
          import Foundation
          import AppKit
          import CoreGraphics
          let args = CommandLine.arguments
          let x = Double(args[1])!, y = Double(args[2])!
          if let app = NSWorkspace.shared.runningApplications.first(where: { $0.localizedName?.contains("Device Hub") == true }) {
            app.activate(options: [.activateIgnoringOtherApps])
            usleep(800_000)
          }
          let p = CGPoint(x: x, y: y)
          CGEvent(mouseEventSource: nil, mouseType: .mouseMoved, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
          usleep(300_000)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseDown, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
          usleep(120_000)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseUp, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
          print("clicked \(x),\(y)")
          SWIFT

          # window bounds: X Y W H  (main "DuoGUI" window)
          LINE=$(awk -F'\t' '$3=="DuoGUI" {print; exit}' out/win-before.txt)
          echo "WIN=$LINE"
          WX=$(echo "$LINE" | cut -f4)
          WY=$(echo "$LINE" | cut -f5)
          WW=$(echo "$LINE" | cut -f6)
          WH=$(echo "$LINE" | cut -f7)
          WID=$(echo "$LINE" | cut -f1)

          # bottom control strip: three form-factor buttons at ~ (0.654,0.693,0.716) * W, y ~0.961 * H
          for frac in 0.654 0.693 0.716 0.560; do
            CX=$(( WX + $(python3 -c "print(int($WW*$frac))") ))
            CY=$(( WY + $(python3 -c "print(int($WH*0.961))") ))
            echo "== click $frac -> $CX,$CY"
            swift "$RUNNER_TEMP/click.swift" "$CX" "$CY" || true
            sleep 8
            screencapture -x -o -l "$WID" "out/hub-after-${frac}.png" || true
            xcrun simctl io "$UDID" screenshot --display=3 "out/d3-after-${frac}.png" || true
            xcrun simctl io "$UDID" screenshot --display=1 "out/d1-after-${frac}.png" || true
            xcrun simctl io "$UDID" enumerate > "out/enum-after-${frac}.txt" 2>&1 || true
            swift "$RUNNER_TEMP/winbounds.swift" > "out/win-after-${frac}.txt" 2>&1 || true
            grep -c Display "out/enum-after-${frac}.txt" || true
            grep -E "Default width|Default height" "out/enum-after-${frac}.txt" | tr '\n' ' ' || true
            echo
          done
          ls -l out || true
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f" || true; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-gui4
          path: out
          if-no-files-found: warn
