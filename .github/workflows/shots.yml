name: shots

on:
  workflow_dispatch:

env:
  BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
  TEAM_ID: ${{ vars.PARTFIT_TEAM_ID }}
  EXPO_PUBLIC_DEMO: "1"
  EXPO_PUBLIC_SHOTS: "1"

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Pick a 6.9in simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Pro Max' | head -1)
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Plus' | head -1); fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "using: $NAME"

      - name: Start Metro
        run: |
          set -x
          EXPO_PUBLIC_DEMO=1 EXPO_PUBLIC_SHOTS=1 npx expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8081/status | grep -q running; then echo "metro up after $((i*2))s"; break; fi
            sleep 2
          done
          if ! curl -sf http://localhost:8081/status | grep -q running; then
            echo "METRO FAILED TO START"; tail -30 "$RUNNER_TEMP/metro.log"; exit 1
          fi
          # warm the bundle so the first app request is fast
          curl -s -o /dev/null -w "bundle_http=%{http_code}\n" \
            "http://localhost:8081/index.bundle?platform=ios&dev=true&minify=false" || true

      - name: Build debug app for simulator
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b || true
          xcrun simctl status_bar "${{ steps.sim.outputs.name }}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Install and launch
        run: |
          set -x
          DEV="${{ steps.sim.outputs.name }}"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE_ID"
          sleep 1
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/s0.png"
          sleep 1
          xcrun simctl spawn "$DEV" launchctl list | grep -i partfit || echo "not running"
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/s1.png"
          sleep 2
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/s2.png"

      - name: Capture screens
        run: |
          set -x
          DEV="${{ steps.sim.outputs.name }}"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP"/s*.png "$OUT"/ 2>/dev/null || true
          # tour timing: Home 0-4s, Result 4-9s, Detail 9-14s, Lookup 14-19s, Sources 19s+
          xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE_ID" || true
          sleep 2
          xcrun simctl io "$DEV" screenshot "$OUT/01-home.png"
          sleep 3
          xcrun simctl io "$DEV" screenshot "$OUT/02-result-xwfe.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/03-detail.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/04-lookup.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/05-sources.png"
          ls -l "$OUT"
          md5 "$OUT"/*.png || true

      - name: Metro log tail
        if: always()
        run: tail -80 "$RUNNER_TEMP/metro.log" || true

      - name: Crash reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/crash"
          find ~/Library/Logs/DiagnosticReports -type f -name 'PartFit*.ips' -mmin -20 -exec cp {} "$RUNNER_TEMP/crash/" \; 2>/dev/null || true
          ls -l "$RUNNER_TEMP/crash" || true
          for f in "$RUNNER_TEMP"/crash/*.ips; do echo "=== $f"; head -c 2500 "$f"; echo; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partfit-shots
          path: |
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/crash/*.ips
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
          retention-days: 7
