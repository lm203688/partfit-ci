name: shots

on:
  workflow_dispatch:

env:
  BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
  TEAM_ID: ${{ vars.PARTFIT_TEAM_ID }}
  EXPO_PUBLIC_DEMO: "1"
  EXPO_PUBLIC_SHOTS: "1"

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund

      - name: Prebuild iOS project
        env:
          PARTFIT_BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
          PARTFIT_TEAM_ID: ${{ vars.PARTFIT_TEAM_ID }}
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Pick a 6.9in simulator
        id: sim
        run: |
          xcrun simctl list devices available | head -40
          NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Pro Max' | head -1)
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Plus' | head -1); fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "using: $NAME"

      - name: Start Metro for the debug build
        run: |
          set -x
          EXPO_PUBLIC_DEMO=1 EXPO_PUBLIC_SHOTS=1 npx expo start --port 8081 --non-interactive > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/status | grep -q running; then echo "metro up after ${i}s"; break; fi
            sleep 2
          done
          curl -s http://localhost:8081/status || true
          tail -20 "$RUNNER_TEMP/metro.log"

      - name: Build debug app for simulator
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -25

      - name: Boot simulator
        run: |
          set -x
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b || true
          xcrun simctl status_bar "${{ steps.sim.outputs.name }}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl list devices | grep Booted

      - name: Install and launch
        run: |
          set -x
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          echo "app=$APP"
          xcrun simctl install "${{ steps.sim.outputs.name }}" "$APP"
          xcrun simctl launch --terminate-running-process "${{ steps.sim.outputs.name }}" "$BUNDLE_ID"
          sleep 6

      - name: Capture screens
        run: |
          set -x
          DEV="${{ steps.sim.outputs.name }}"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          # Tour restarts only on a fresh process; relaunch so the timing windows line up:
          # Home 0-4s, Result 4-9s, Detail 9-14s, Lookup 14-19s, Sources 19s+.
          xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE_ID" || true
          sleep 2
          xcrun simctl io "$DEV" screenshot "$OUT/01-home.png"
          sleep 3
          xcrun simctl io "$DEV" screenshot "$OUT/02-result-xwfe.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/03-detail.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/04-lookup.png"
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/05-sources.png"
          ls -l "$OUT"

      - name: Metro log tail
        if: always()
        run: tail -60 "$RUNNER_TEMP/metro.log" || true

      - name: Crash reports
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.name }}" log show --last 3m --predicate 'eventMessage CONTAINS[c] "partfit"' 2>/dev/null | tail -40 || true
          find ~/Library/Logs/DiagnosticReports ~/Library/Developer/CoreSimulator -type f -name 'PartFit*' -mmin -10 2>/dev/null | head -3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partfit-shots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn
          retention-days: 7
