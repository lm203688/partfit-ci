name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
  WIDGET_BUNDLE_ID: ${{ vars.PARTFIT_WIDGET_BUNDLE_ID }}
  TEAM_ID: ${{ vars.PARTFIT_TEAM_ID }}

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          sw_vers

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund

      - name: Unit tests (bundled data + date engine + feedback loop)
        run: node --test test/

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          set -x
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p pfpass build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p pfpass build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k pfpass build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profiles
        env:
          PROFILE_MAIN_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          PROFILE_MAIN_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
          PROFILE_WIDGET_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          PROFILE_WIDGET_UUID: ${{ secrets.PROFILE_WIDGET_UUID }}
        run: |
          set -x
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_MAIN_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_MAIN_UUID.mobileprovision"
          printf '%s' "$PROFILE_WIDGET_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_WIDGET_UUID.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Prebuild iOS project
        env:
          PARTFIT_BUNDLE_ID: ${{ vars.PARTFIT_BUNDLE_ID }}
          PARTFIT_TEAM_ID: ${{ vars.PARTFIT_TEAM_ID }}
          PARTFIT_WIDGET_BUNDLE_ID: ${{ vars.PARTFIT_WIDGET_BUNDLE_ID }}
          PARTFIT_PROFILE_MAIN: ${{ secrets.PROFILE_MAIN_UUID }}
          PARTFIT_PROFILE_WIDGET: ${{ secrets.PROFILE_WIDGET_UUID }}
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Guard app icon has no alpha (ITMS-90717)
        run: python3 .github/scripts/check_icon_alpha.py

      - name: Check target signing settings
        run: |
          grep -o 'PROVISIONING_PROFILE_SPECIFIER = [^;]*' ios/*.xcodeproj/project.pbxproj || true
          ls ios/PartFitWidget || true

      - name: Archive
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/partfit.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -80

      - name: Export ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          PROFILE_MAIN_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
          PROFILE_WIDGET_UUID: ${{ secrets.PROFILE_WIDGET_UUID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_MAIN_UUID</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$PROFILE_WIDGET_UUID</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/partfit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -60
          ls -l "$RUNNER_TEMP/ipa" || true

      - name: Verify ipa contents
        run: |
          set -x
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          unzip -l "$IPA" | grep -Ei 'appex|PlugIns' || true
          rm -rf "$RUNNER_TEMP/ipa-x" && mkdir -p "$RUNNER_TEMP/ipa-x"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-x"
          APP=$(find "$RUNNER_TEMP/ipa-x/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          plutil -p "$APP/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString' || true
          ls "$APP" | grep -Ei 'ocr|PartFitOcr' || true
          echo "== UIScene gate =="
          plutil -p "$APP/Info.plist" > "$RUNNER_TEMP/plist.txt"
          grep -n "UIApplicationSceneManifest" "$RUNNER_TEMP/plist.txt" || { echo "FAIL: no scene manifest in signed ipa"; exit 1; }
          sed -n '/UIApplicationSceneManifest/,+12p' "$RUNNER_TEMP/plist.txt"
          grep -n "class SceneDelegate" ios/*/AppDelegate.swift || { echo "FAIL: SceneDelegate missing"; exit 1; }
          echo "OK: signed ipa adopts UIScene lifecycle"
          echo "== app intents gate =="
          test -d "$APP/Metadata.appintents" || { echo "FAIL: App Intents metadata missing from signed ipa"; exit 1; }
          grep -raq "PartFitShortcuts" "$APP/Metadata.appintents" || { echo "FAIL: PartFitShortcuts not registered in intent metadata"; exit 1; }
          echo "OK: App Intents shortcuts registered"
          test -f "$APP/fitment-index.json" || { echo "FAIL: fitment-index.json not bundled"; exit 1; }
          echo "OK: fitment index bundled"
          echo "== widget gate =="
          test -d "$APP/PlugIns/PartFitWidget.appex" || { echo "FAIL: widget appex missing"; exit 1; }
          plutil -p "$APP/PlugIns/PartFitWidget.appex/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|NSExtensionPointIdentifier' || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A3 'application-groups' || { echo "FAIL: app missing app group entitlement"; exit 1; }
          codesign -d --entitlements :- "$APP/PlugIns/PartFitWidget.appex" 2>/dev/null | grep -A3 'application-groups' || { echo "FAIL: widget missing app group entitlement"; exit 1; }
          codesign -dv "$APP/PlugIns/PartFitWidget.appex" 2>&1 | grep -Ei 'Identifier|TeamIdentifier' | head -4 || true
          echo "OK: widget bundled and signed with app group"
          echo "== spotlight gate =="
          grep -raq -F "PartFit spotlight index failed" "$APP" || { echo "FAIL: spotlight bridge not compiled into any shipped binary"; grep -raq -i "partfitshared" "$APP" | head -3; exit 1; }
          grep -raq -i "PartfitSharedModule" "$APP" || { echo "FAIL: shared module missing from bundle"; exit 1; }
          echo "OK: Core Spotlight bridge compiled in"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
            --verbose 2>&1 | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partfit-release
          path: |
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
