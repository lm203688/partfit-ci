name: probe-devicehub

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: devicehub
        run: |
          set +e
          UDID=$(xcrun simctl create "DuoDH" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p out
          HUB="/Applications/Xcode_27.1.app/Contents/Applications/DeviceHub.app"
          echo "hub exists: $([ -d "$HUB" ] && echo yes || echo no)"
          open -a "$HUB" 2>&1
          sleep 30
          echo "=== processes ==="
          pgrep -fl DeviceHub | head -5
          echo "=== windows ==="
          osascript -e 'tell application "System Events" to tell process "DeviceHub" to get {name, size, position} of every window' 2>&1 | head -10
          echo "=== host screenshot ==="
          screencapture -x out/host.png 2>&1
          echo "=== sim screenshots after hub ==="
          for d in 1 3 5; do xcrun simctl io "$UDID" screenshot --display=$d "out/hub$d.png" 2>&1; done
          echo "=== launch Settings + shots ==="
          xcrun simctl launch "$UDID" com.apple.Preferences 2>&1
          sleep 8
          for d in 1 3; do xcrun simctl io "$UDID" screenshot --display=$d "out/set$d.png" 2>&1; done
          echo "=== menu items ==="
          osascript -e 'tell application "System Events" to tell process "DeviceHub" to get name of every menu bar item of menu bar 1' 2>&1 | head -5
          ls -l out
          sips -g pixelWidth -g pixelHeight out/*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-hub-shots
          path: out
          if-no-files-found: warn
